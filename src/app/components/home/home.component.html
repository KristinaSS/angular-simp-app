<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
/>

<app-navbar [drawer]="drawer" [isLoading]="isLoading"></app-navbar>

<mat-drawer-container class="full-vh-vw" autosize>
  <mat-drawer #drawer class="sidenav-drawer" mode="side">
    <mat-nav-list>
      <a mat-list-item>
        <span class="entry hovered">
          <i class="fa-solid fa-house padding-left-5px"></i>
          <span class="padding-left-5px">Home</span>
        </span>
      </a>
      <a mat-list-item>
        <span class="entry hovered">
          <i class="fa-solid fa-coins padding-left-5px"></i>
          <span class="padding-left-5px">On Sale</span>
        </span>
      </a>
      <a mat-list-item>
        <span class="entry hovered">
          <i class="fa-solid fa-list-check padding-left-5px"></i>
          <span class="padding-left-5px">Instructions</span>
        </span>
      </a>
      <a mat-list-item>
        <span class="entry hovered">
          <i class="fa-solid fa-gamepad padding-left-5px"></i>
          <span class="padding-left-5px">Game</span>
        </span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <!-- this outer div is used for layout measuring -->
    <div #box style="width: 100%">
      <app-background [isLoading]="isLoading"></app-background>

      <app-loader
        *ngIf="isLoading"
        class="box-center flex-display align-content-center justify-content-center position-absolute"
      ></app-loader>

      <app-filters
        [(search)]="search"
        [(filteredChampions)]="filteredChampions"
        [(noResults)]="noResults"
        [isLoading]="isLoading"
        [champions]="champions"
        [account]="account"
        [clickedNum]="clickedNum"
      ></app-filters>

      <app-champion-box
        [nameFlag]="nameFlag"
        [account]="account"
        [(clickedNum)]="clickedNum"
        [(columns)]="columns"
        [(accountSkinsOwned)]="accountSkinsOwned"
        [filteredChampions]="filteredChampions"
        [noResults]="noResults"
      ></app-champion-box>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
